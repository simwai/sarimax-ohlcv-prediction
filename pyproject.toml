[project]
name = "sarimax-ohlcv-prediction"
version = "0.1.0"
description = "Bitcoin price prediction with SARIMAX, Prophet, and LSTM models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "plotly>=5.20,<7",
    "prophet>=1.1",
    "pmdarima>=2.0",
    "pandas>=2.1",
    "ccxt>=4.2",
    "colorlog>=6.8",
    "rich>=13.7",
    "typer>=0.9",
    "vectorbt>=0.29",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
    "numpy>=1.26",
    "joblib>=1.4",
    "reportlab>=5.0.1",
]
[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pyrefly>=1.2.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "prompt-toolkit>=3.0",
]

[tool.pdm.scripts]
run = "python -m sarimax_ohlcv_prediction"
repl = "python -m sarimax_ohlcv_prediction repl"
train = "python -m sarimax_ohlcv_prediction train"
predict = "python -m sarimax_ohlcv_prediction predict"
backtest = "python -m sarimax_ohlcv_prediction backtest"
fetch = "python -m sarimax_ohlcv_prediction fetch"
explore = "python -m sarimax_ohlcv_prediction explore"
streamlit = "streamlit run src/sarimax_ohlcv_prediction/streamlit_app.py"
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyrefly check"
test = "pytest"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sarimax_ohlcv_prediction*"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "ARG",
    "PTH",
    "T20",
    "SIM",
    "RET",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "NPY",
    "DTZ",
    "EXE",
    "ISC",
]
ignore = ["S101", "T201", "ARG001", "ARG002"]
exclude = [".venv", ".venv_win", "__pycache__", "*.egg-info", ".pdm-build"]
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["S101", "T201", "ARG001", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"index.py" = ["PLR0913", "PLR0917", "TRY301", "TRY003", "TRY300", "UP017"]
"src/sarimax_ohlcv_prediction/backtest/engine.py" = ["PLC0415"]
"src/sarimax_ohlcv_prediction/cli/main.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/backtest.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/cache.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/compare.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/explore.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/fetch.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/predict.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/repl.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/train.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/cli/commands/report.py" = ["PLR0913", "PLR0917", "PLC0415", "E501"]
"src/sarimax_ohlcv_prediction/reports/pdf.py" = ["E501"]
"src/sarimax_ohlcv_prediction/cli/compare_core.py" = ["PLR0913", "PLR0917", "PLC0415"]
"src/sarimax_ohlcv_prediction/cli/repl_core.py" = ["E501", "PLR0913", "PLR0917", "TRY300"]
"src/sarimax_ohlcv_prediction/cli/repl_inquirer.py" = ["E501", "PLR0913", "PLR0917"]
"src/sarimax_ohlcv_prediction/data/fetcher.py" = ["TRY300"]
"src/sarimax_ohlcv_prediction/cache/backend.py" = ["PLW0603"]
"src/sarimax_ohlcv_prediction/models/base.py" = ["TRY004"]
"src/sarimax_ohlcv_prediction/models/__init__.py" = ["E501"]
"src/sarimax_ohlcv_prediction/services/cycle.py" = ["PLR0913", "PLR0917", "UP017"]
"src/sarimax_ohlcv_prediction/models/lstm.py" = ["PLR0913", "PLR0917", "TRY300", "PLE1206"]
"src/sarimax_ohlcv_prediction/models/prophet.py" = ["PLR0913", "PLR0917"]
"src/sarimax_ohlcv_prediction/streamlit_app.py" = ["PLR0913", "PLR0917", "UP017"]
"tests/test_imports.py" = ["I001"]

[tool.pyrefly]
# pyrefly configuration for strict type checking
# Uses pyproject.toml as config source
project_includes = ["src/**/*.py", "tests/**/*.py", "index.py"]
project_excludes = [".venv", ".venv_win", "**/__pycache__", "**/build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/sarimax_ohlcv_prediction"]
omit = ["*/tests/*", "*/__pycache__/*"]